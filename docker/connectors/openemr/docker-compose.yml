# Runs OpenEMR locally for app.connectors.openemr development against a
# real backend — mirrors the official production example at
# https://github.com/openemr/openemr/blob/master/docker/production/docker-compose.yml
# (image/digest pins pulled from there as of 2026-10-21; bump both together
# when upgrading, never the tag alone — see openemr/openemr's DOCKER_README.md).
#
# Use admin/pass as user/password to log into the OpenEMR web UI (from
# OE_USER/OE_PASS below). MYSQL_HOST/MYSQL_ROOT_PASS are required by the
# openemr image; MYSQL_USER/MYSQL_PASS/OE_USER/OE_PASS are optional and
# default to openemr/openemr/admin/pass if omitted.
#
# Start:   docker compose -f docker/connectors/openemr/docker-compose.yml up -d
# Stop:    docker compose -f docker/connectors/openemr/docker-compose.yml down
# Web UI:  https://localhost/ (self-signed cert — accept the browser warning)
#
# Startup takes 5-10 minutes on first run (OpenEMR's own DB migration/setup).
# Watch it with: docker compose -f docker/connectors/openemr/docker-compose.yml logs -f openemr
#
# FHIR is NOT enabled by default — there is no OPENEMR_SETTING_ env var for
# it (checked against the current official docs). After first boot:
#   1. Log into the web UI as admin/pass.
#   2. Administration -> Config -> Connectors -> check "Enable OpenEMR
#      Standard FHIR REST API" -> set Site Address to https://localhost
#      (required for OAuth2/FHIR) -> Save.
#   3. Register an OAuth2 client: POST to
#      https://localhost/oauth2/default/registration — see
#      https://github.com/openemr/openemr/blob/master/API_README.md and
#      AUTHENTICATION.md in that same repo for the client-credentials flow.
#   4. FHIR base path once enabled: https://localhost/apis/default/fhir
#      (Swagger UI the same shape as https://eleven.openemr.io/a/openemr/swagger/index.html,
#      served at https://localhost/swagger/ on this local instance).

services:
  mysql:
    restart: always
    image: mariadb:12.3.3@sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    volumes:
      - openemr_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Auto-runs mariadb-upgrade against a data dir left by an older
      # MariaDB version on container start; no-op if already current.
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

  openemr:
    restart: always
    image: openemr/openemr:latest@sha256:ec3e76c00fd0753c52e8d12b70c5dd56a61c07a8eec978cb80183aefb796a6d5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - openemr_logs:/var/log
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: root
      MYSQL_USER: openemr
      MYSQL_PASS: openemr
      OE_USER: admin
      OE_PASS: pass
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/curl",
          "--fail",
          "--insecure",
          "--location",
          "--show-error",
          "--silent",
          "https://localhost/meta/health/readyz",
        ]
      start_period: 3m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3

volumes:
  openemr_logs: {}
  openemr_sites: {}
  openemr_db: {}
